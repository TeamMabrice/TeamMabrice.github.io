<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Mabrice</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@600;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Nunito", sans-serif;
        background: #0f0f0f;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 20px 50px;
        position: relative;
        overflow-x: hidden;
      }

      /* Fond animé foot */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 20% 20%,
            rgba(46, 204, 113, 0.18) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse at 80% 80%,
            rgba(243, 156, 18, 0.18) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse at 50% 50%,
            rgba(231, 76, 60, 0.08) 0%,
            transparent 70%
          );
        z-index: 0;
        animation: bgPulse 6s ease-in-out infinite alternate;
      }

      @keyframes bgPulse {
        from {
          opacity: 0.7;
        }
        to {
          opacity: 1;
        }
      }

      .container {
        width: 100%;
        max-width: 520px;
        position: relative;
        z-index: 1;
        animation: fadeInUp 0.7s ease both;
      }

      /* ── HEADER ── */
      .header {
        text-align: center;
        margin-bottom: 28px;
      }

      .avatar {
        width: 200px;
        height: 200px;
        margin: 0 auto 6px;
        animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      @keyframes popIn {
        from {
          transform: scale(0.5);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      h1 {
        font-family: "Bebas Neue", sans-serif;
        font-size: 3em;
        letter-spacing: 3px;
        background: linear-gradient(
          135deg,
          #2ecc71 0%,
          #f39c12 60%,
          #e74c3c 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin-bottom: 6px;
      }

      .tagline {
        color: rgba(255, 255, 255, 0.45);
        font-size: 0.85em;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      /* ── RÉSEAUX SOCIAUX (ligne d'icônes) ── */
      .socials-row {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-bottom: 30px;
        animation: fadeInUp 0.6s ease 0.2s both;
      }

      .social-icon {
        width: 58px;
        height: 58px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition:
          transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.25s ease;
        position: relative;
        overflow: hidden;
      }

      .social-icon svg {
        width: 28px;
        height: 28px;
        fill: white;
        position: relative;
        z-index: 1;
        transition: transform 0.2s ease;
      }

      .social-icon:hover {
        transform: translateY(-5px) scale(1.1);
      }

      .social-icon:hover svg {
        transform: scale(1.15);
      }

      .social-icon::after {
        content: attr(data-label);
        position: absolute;
        bottom: -28px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.7em;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.7);
        white-space: nowrap;
        letter-spacing: 0.5px;
        transition:
          bottom 0.2s ease,
          opacity 0.2s ease;
        opacity: 0;
      }

      .social-icon:hover::after {
        bottom: -22px;
        opacity: 1;
      }

      .si-instagram {
        background: linear-gradient(
          135deg,
          #833ab4 0%,
          #fd1d1d 50%,
          #fcb045 100%
        );
        box-shadow: 0 6px 20px rgba(253, 29, 29, 0.4);
      }

      .si-facebook {
        background: linear-gradient(135deg, #1877f2 0%, #4267b2 100%);
        box-shadow: 0 6px 20px rgba(24, 119, 242, 0.4);
      }

      .si-youtube {
        background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
        box-shadow: 0 6px 20px rgba(255, 0, 0, 0.4);
      }

      /* ── CARTE VIDÉO ── */
      .video-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        animation: fadeInUp 0.6s ease 0.35s both;
        backdrop-filter: blur(10px);
      }

      .video-label {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 20px 10px;
      }

      .video-badge {
        background: linear-gradient(135deg, #047232, #0e5e30);
        color: white;
        font-size: 0.7em;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 20px;
      }

      .video-title-text {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.82em;
        font-weight: 700;
      }

      .video-wrapper {
        position: relative;
        padding-bottom: 56.25%;
        height: 0;
        cursor: pointer;
        overflow: hidden;
      }

      .video-wrapper img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition:
          transform 0.4s ease,
          filter 0.4s ease;
        filter: brightness(0.85);
      }

      .video-wrapper:hover img {
        transform: scale(1.04);
        filter: brightness(0.7);
      }

      .play-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 70px;
        height: 70px;
        background: rgba(255, 0, 0, 0.9);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
          background 0.3s ease;
        box-shadow: 0 8px 30px rgba(255, 0, 0, 0.5);
        z-index: 2;
      }

      .play-btn svg {
        width: 30px;
        height: 30px;
        fill: white;
        margin-left: 4px;
      }

      .video-wrapper:hover .play-btn {
        transform: translate(-50%, -50%) scale(1.15);
        background: rgba(200, 0, 0, 1);
      }

      .video-overlay-text {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 0.8em;
        font-weight: 800;
        letter-spacing: 1px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        white-space: nowrap;
        z-index: 2;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .video-wrapper:hover .video-overlay-text {
        opacity: 1;
      }
      .video-image{ width: 100%;
      height: auto}
    .video-image img{
    
      width: 100%;
      height: 100%;
      
      }

      /* ── FOOTER ── */
      .footer {
        margin-top: 24px;
        text-align: center;
        color: rgba(255, 255, 255, 0.2);
        font-size: 0.75em;
        font-weight: 600;
        letter-spacing: 1px;
        animation: fadeInUp 0.6s ease 0.5s both;
      }

      /* ── ANIMATIONS ── */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(25px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 420px) {
        h1 {
          font-size: 2.4em;
        }
        .social-icon {
          width: 52px;
          height: 52px;
        }
        .social-icon svg {
          width: 24px;
          height: 24px;
        }
      }
    </style>
  </head>
  <body>

      </div>

</html>
